<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>恭喜你解锁彩蛋 · Evander's Repo</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon-egg.svg">
<meta name="description" content="Evander's Repo 的第二个隐藏页面。">
<style>
  :root{color-scheme:dark;--bg:#0a0f1e;--card:#131d33;--bd:#26365a;--tx:#eaf1ff;--mut:#93a7cd;--acc:#4a9dff}
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;background:radial-gradient(1000px 560px at 50% -12%,#2a2058 0%,#101a38 48%,var(--bg) 100%);
       color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
       line-height:1.65;overflow-x:hidden;-webkit-text-size-adjust:100%}
  a{color:var(--acc)}

  /* 缓慢飘落的彩色纸片，纯 CSS，不加载任何外链资源 */
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .confetti span{position:absolute;top:-12vh;width:9px;height:16px;border-radius:2px;opacity:0;
                 animation:fall linear infinite}
  @keyframes fall{
    0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0}
    8%{opacity:.75}
    90%{opacity:.55}
    100%{transform:translate3d(60px,112vh,0) rotate(680deg);opacity:0}
  }
  .confetti span:nth-child(1){left:4%;background:#4a9dff;animation-duration:9s;animation-delay:0s}
  .confetti span:nth-child(2){left:12%;background:#ff6f91;animation-duration:11s;animation-delay:1.4s;width:7px;height:13px}
  .confetti span:nth-child(3){left:20%;background:#42d392;animation-duration:8.5s;animation-delay:3.1s}
  .confetti span:nth-child(4){left:28%;background:#ffd166;animation-duration:12s;animation-delay:.6s;width:11px;height:11px;border-radius:50%}
  .confetti span:nth-child(5){left:36%;background:#b388ff;animation-duration:10s;animation-delay:2.2s}
  .confetti span:nth-child(6){left:44%;background:#4a9dff;animation-duration:13s;animation-delay:4.5s;width:6px;height:18px}
  .confetti span:nth-child(7){left:52%;background:#ff9f68;animation-duration:9.5s;animation-delay:1.1s}
  .confetti span:nth-child(8){left:60%;background:#42d392;animation-duration:11.5s;animation-delay:3.8s;width:10px;height:10px;border-radius:50%}
  .confetti span:nth-child(9){left:68%;background:#ff6f91;animation-duration:8.8s;animation-delay:.3s}
  .confetti span:nth-child(10){left:76%;background:#ffd166;animation-duration:12.5s;animation-delay:5.2s;width:7px;height:14px}
  .confetti span:nth-child(11){left:84%;background:#b388ff;animation-duration:10.5s;animation-delay:2.7s}
  .confetti span:nth-child(12){left:92%;background:#4a9dff;animation-duration:9.2s;animation-delay:4.1s;width:11px;height:11px;border-radius:50%}

  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:52px 20px 64px;text-align:center}
  .eyebrow{display:inline-block;font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;
           color:#9ecbff;border:1px solid var(--bd);border-radius:99px;padding:5px 16px;background:#0e1830aa}
  h1{margin:20px 0 6px;font-size:clamp(30px,7vw,52px);font-weight:800;letter-spacing:1px;line-height:1.25;
     background:linear-gradient(100deg,#7ee8ff 0%,#8f9bff 42%,#ff8ac2 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 6px 26px #6f8bff55);animation:float 4.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .sub{margin:0;font-size:15px;color:var(--mut)}
  .sub b{color:#cfe4ff;font-weight:600}
  .whisper{margin:14px 0 0;font-size:14.5px;color:#c9b6ff;letter-spacing:.4px;
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",
                       "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  .whoami{display:inline-flex;align-items:center;gap:8px;margin:9px 0 0;padding:4px 13px;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;letter-spacing:.9px;
          color:#9fb4d9;background:#0b1425cc;border:1px solid #2a3a5c;border-radius:7px}
  .whoami::before{content:"";width:6px;height:6px;border-radius:50%;background:#42d392;
                  box-shadow:0 0 8px #42d39299}

  .stage{margin-top:30px;background:var(--card);border:1px solid var(--bd);border-radius:18px;
         padding:12px;box-shadow:0 24px 70px #0009,0 0 0 1px #ffffff08 inset}
  /* 相框：竖图按高度收，宽度自适应，左右留深色边不显空 */
  .photo-wrap{display:flex;justify-content:center;align-items:center;background:#060b16;
              border-radius:11px;overflow:hidden;min-height:180px}
  @media(min-width:600px){.photo-wrap{padding:10px}}
  #eggPhoto{display:block;width:auto;height:auto;max-width:100%;max-height:min(74vh,760px);
            border-radius:8px;cursor:zoom-in;animation:reveal .7s ease both;
            box-shadow:0 12px 40px #0008}
  @keyframes reveal{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
  /* 点一下看大图：独立层，z-index 高于页面所有内容，不会被遮罩压住 */
  .lb{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
      padding:18px;background:#02060ff5;cursor:zoom-out;animation:lbin .22s ease both}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:10px;
          box-shadow:0 30px 90px #000d}
  @keyframes lbin{from{opacity:0}to{opacity:1}}
  .hint{margin-top:14px;font-size:13px;color:var(--mut);min-height:20px}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .actions a,.actions button{display:inline-block;text-decoration:none;cursor:pointer;font-size:14px;font-weight:600;
    border-radius:10px;padding:10px 22px;transition:.15s;border:1px solid var(--bd)}
  .actions a{background:#1c335c;color:#cfe4ff}
  .actions button{background:var(--acc);color:#04122a;border-color:var(--acc)}
  .actions a:hover,.actions button:hover{filter:brightness(1.18)}

  footer{position:relative;z-index:1;margin-top:40px;text-align:center;color:#5e7197;font-size:12px;line-height:2}
  #stamp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
  @media(prefers-reduced-motion:reduce){
    .confetti span{animation:none;opacity:.2}
    h1,#eggPhoto{animation:none}
  }
</style>
</head>
<body>

<div class="confetti" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<main class="wrap">
  <div class="eyebrow">Hidden page · 02</div>
  <h1>恭喜你解锁彩蛋</h1>
  <p class="sub">你是少数会把<b>页脚</b>点第二遍的人，那张照片就当奖励。</p>
  <p class="whisper">不要告诉别人哦🙄</p>
  <p class="whoami">Guest whoami</p>

  <div class="stage">
    <div class="photo-wrap">
      <img id="eggPhoto" src="assets/egg2-780.jpg"
           srcset="assets/egg2-780.jpg 780w, assets/egg2-1160.jpg 1160w"
           sizes="(max-width:840px) calc(100vw - 64px), 776px"
           width="780" height="1228" alt="彩蛋照片 · 点一下看大图" decoding="async">
    </div>
  </div>
  <div class="hint" id="hint">点照片看大图 · 再点一下收起来</div>

  <div class="lb" id="lightbox" aria-hidden="true"><img alt="彩蛋照片大图"></div>

  <div class="actions">
    <a href="./">← 返回首页</a>
    <a href="egg.html">看看第一个彩蛋</a>
  </div>
</main>

<footer>
  <div id="stamp"></div>
  第二个入口藏在 WorkBuddy 那一行，别告诉别人 · <a href="./">Evander's Repo</a>
</footer>

<script>
(function(){
  var photo = document.getElementById('eggPhoto');
  var stamp = document.getElementById('stamp');
  var hint = document.getElementById('hint');

  var d = new Date();
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  stamp.textContent = '解锁于 ' + d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate())
                    + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());

  var lb = document.getElementById('lightbox');
  var lbImg = lb.querySelector('img');
  function openLB(){
    lbImg.src = 'assets/egg2-1160.jpg';
    lb.classList.add('on');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    hint.textContent = '点任意处收起';
  }
  function closeLB(){
    lb.classList.remove('on');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    hint.textContent = '点照片看大图 · 再点一下收起来';
  }
  photo.addEventListener('click', openLB);
  lb.addEventListener('click', closeLB);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && lb.classList.contains('on')) closeLB();
  });
})();
</script>
</body>
</html>
